[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casmd"
version = "0.12.0"
description = "CasMD — generic protein–nucleic acid MD workflow"
authors = [{name = "Zibin Zhao", email = "zzhaobz@connect.ust.hk"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "MDAnalysis>=2.7",
    "biopython>=1.83",
    "Jinja2>=3.1",
    "py7zr>=0.21",
    "numpy>=1.26",
    "parmed>=4.2",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "scipy>=1.12",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
casmd-build = "casmd.build.cli:main"
casmd-predict = "casmd.predict.cli:main"
casmd-bundle = "casmd.bundle.cli:main"
casmd-report = "casmd.report.cli:main"
casmd-run = "casmd.run.cli:main"
casmd-ui = "casmd.cli:main"
casmd-desktop = "casmd.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"casmd.bundle" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[project.urls]
Homepage = "https://github.com/zibin-zhao/CasMD"
Repository = "https://github.com/zibin-zhao/CasMD"
"Hugging Face Space" = "https://huggingface.co/spaces/zzhaobz/HsingMD"
Issues = "https://github.com/zibin-zhao/CasMD/issues"
